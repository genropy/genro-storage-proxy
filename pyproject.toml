[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genro-storage-proxy"
version = "0.1.0"
description = "HTTP microservice that exposes genro-storage capabilities via REST API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Genropy Team", email = "info@genropy.org"}
]
keywords = ["storage", "proxy", "microservice", "fastapi", "genro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "genro-storage>=0.4.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/genropy/genro-storage-proxy"
Repository = "https://github.com/genropy/genro-storage-proxy"
"Bug Tracker" = "https://github.com/genropy/genro-storage-proxy/issues"

[tool.setuptools]
packages = ["genro_storage_proxy"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=genro_storage_proxy --cov-report=term-missing"
asyncio_mode = "auto"
